name: Pinned Lean and Mathlib
description: Install the repository toolchain and restore Mathlib binaries
runs:
  using: composite
  steps:
    - name: Restore pinned Lean toolchain
      id: lean-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.elan/bin
          ~/.elan/toolchains
        key: rh-lean-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
    - name: Install elan
      shell: bash
      run: |
        if [[ ! -x "$HOME/.elan/bin/elan" ]] && ! command -v elan >/dev/null; then
          curl --fail --silent --show-error --location --retry 3 https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
        fi
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
    - name: Install pinned Lean
      shell: bash
      run: |
        for delay in 5 15 30; do
          if lean --version; then
            exit 0
          fi
          echo "Retrying the pinned Lean toolchain download in ${delay}s" >&2
          sleep "$delay"
        done
        lean --version
    - name: Save pinned Lean toolchain
      if: steps.lean-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.elan/bin
          ~/.elan/toolchains
        key: ${{ steps.lean-cache.outputs.cache-primary-key }}
    - name: Restore dependency builds
      uses: actions/cache@v4
      id: mathlib
      with:
        path: .lake/packages
        key: rh-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
    - name: Get official Mathlib binaries
      if: steps.mathlib.outputs.cache-hit != 'true'
      shell: bash
      run: lake exe cache get
