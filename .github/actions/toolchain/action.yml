name: Pinned Lean and Mathlib
description: Prepare the self-hosted Linux x64 runner and restore pinned dependencies
runs:
  using: composite
  steps:
    - name: Prepare writable tool and GitHub CLI directories
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/runner.sh"
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false
    - name: Select Python and the pinned Lean toolchain
      shell: bash
      run: |
        export UV_PYTHON_INSTALL_DIR="$(dirname "$RUNNER_TEMP")/rh-tools/python"
        uv python install 3.12
        interpreter=$(uv python find --managed-python 3.12)
        "$interpreter" -c 'import tarfile; assert callable(tarfile.data_filter)'
        dirname "$interpreter" >> "$GITHUB_PATH"
        lean --version
        lake --version
    - name: Restore dependency builds
      uses: actions/cache@v4
      id: mathlib
      with:
        path: .lake/packages
        key: rh-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
    - name: Get official Mathlib binaries
      if: steps.mathlib.outputs.cache-hit != 'true'
      shell: bash
      run: lake exe cache get
