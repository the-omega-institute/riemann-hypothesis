name: Check a released module
on:
  workflow_dispatch:
    inputs:
      module:
        description: Lean module to restore from published shards
        type: string
        required: true
        default: BuildAid.D1
permissions: {contents: read, actions: read}
jobs:
  restore:
    runs-on: ${{ vars.RH_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Measure identical Release dependencies
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 ci/measure_restore.py
