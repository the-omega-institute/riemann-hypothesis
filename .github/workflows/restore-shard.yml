name: Check the pure zeta window extraction
on:
  workflow_dispatch:
    inputs:
      module:
        type: string
        default: Development.AutomorphicArithmetic.CharacterBoxes.MainConclusion
permissions: {contents: read, actions: read}
jobs:
  verify:
    if: github.ref == 'refs/heads/check/rh-pure-zeta-window-01a1d964'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Confirm the public source and dependency pins
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src)" = 24df20b62d9976ccd20da819bc20b16f808f0fdd
          test "$(git rev-parse HEAD:lean-toolchain)" = a8afa7d1b02d96f0671eba854a8dc4b416beb473
          test "$(git rev-parse HEAD:lake-manifest.json)" = b4d1ec31575a26b2159ec3a262b482bc051f3f6f
          test "$(git rev-parse HEAD:lakefile.toml)" = 7fb51422cf263fbaa82975612a975ea6b3bb5261
          df -h .
      - uses: ./.github/actions/toolchain
      - name: Restore and check the exact import closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lake env python3 -B - <<'NATIVE'
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, "ci")
          from parts import BUILD, STATE, dependencies, graph, inventory, plan, restore

          targets = {"Development.AutomorphicArithmetic.CharacterBoxes.MainConclusion"}
          project = graph()
          edges = project[1]
          data = plan(project)
          wanted = dependencies(targets, edges)
          STATE.mkdir(parents=True, exist_ok=True)
          restore(data, inventory(os.environ["GITHUB_REPOSITORY"]), targets, edges,
                  allow_missing=True)

          def stem(module):
              return Path(*module.split("."))

          def artifact(module):
              return BUILD / "lib/lean" / stem(module).with_suffix(".olean")

          pending = {module for module in wanted if not artifact(module).is_file()}
          print(f"Missing after digest-checked restore: {len(pending)} modules", flush=True)
          options = ["-j1", "--root=src", "--tstack=400000", "-DautoImplicit=false",
                     "-DrelaxedAutoImplicit=false", "-DmaxSynthPendingDepth=3",
                     "-Dpp.unicode.fun=true", "-DmaxHeartbeats=4000000"]
          while pending:
              ready = sorted(module for module in pending
                             if pending.isdisjoint(edges[module]))
              if not ready:
                  sys.exit(f"Missing dependency cycle: {sorted(pending)}")
              for module in ready:
                  lib = artifact(module)
                  ir = BUILD / "ir" / stem(module).with_suffix(".c")
                  lib.parent.mkdir(parents=True, exist_ok=True)
                  ir.parent.mkdir(parents=True, exist_ok=True)
                  print(f"Elaborating {module}", flush=True)
                  subprocess.run(["lean", *options, "-o", str(lib),
                                  "-i", str(lib.with_suffix(".ilean")), "-c", str(ir),
                                  str(Path("src") / stem(module).with_suffix(".lean"))],
                                 check=True, timeout=3600)
                  if not lib.is_file():
                      sys.exit(f"Lean exited without creating {lib}")
                  pending.remove(module)
          NATIVE
      - name: Elaborate the pure zeta extraction and print its axioms
        run: |
          set -euo pipefail
          lean --version
          lake env lean -j1 \
            -o "$RUNNER_TEMP/AlpogePureZetaWindowExtraction.olean" \
            verification/AlpogePureZetaWindowExtraction.lean | tee "$RUNNER_TEMP/pure-zeta-window-lean.log"
          python3 - "$RUNNER_TEMP/pure-zeta-window-lean.log" <<'AXIOMS'
          from pathlib import Path
          import re
          import sys
          text = Path(sys.argv[1]).read_text()
          match = re.search(r"'PureZetaWindowExtraction\.pure_zeta_windows' depends on axioms: \[([^]]*)\]", text)
          if match is None or set(map(str.strip, match.group(1).split(","))) != {"propext", "Classical.choice", "Quot.sound"}:
              raise SystemExit("Missing or unexpected pure zeta axiom report")
          AXIOMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pure-zeta-window-lean-log
          path: ${{ runner.temp }}/pure-zeta-window-lean.log
          if-no-files-found: ignore
