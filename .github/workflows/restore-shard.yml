name: Check the pure zeta window extraction
on:
  workflow_dispatch:
    inputs:
      module:
        type: string
        default: Development.AutomorphicArithmetic.CharacterBoxes.MainConclusion
permissions: {contents: read, actions: read}
jobs:
  verify:
    if: github.ref == 'refs/heads/check/rh-pure-zeta-window-01a1d964'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, clean: false}
      - name: Confirm the public source and dependency pins
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src)" = 24df20b62d9976ccd20da819bc20b16f808f0fdd
          test "$(git rev-parse HEAD:lean-toolchain)" = a8afa7d1b02d96f0671eba854a8dc4b416beb473
          test "$(git rev-parse HEAD:lake-manifest.json)" = b4d1ec31575a26b2159ec3a262b482bc051f3f6f
          test "$(git rev-parse HEAD:lakefile.toml)" = 7fb51422cf263fbaa82975612a975ea6b3bb5261
          df -h .
      - uses: ./.github/actions/toolchain
      - name: Restore the pinned module closure and fill missing entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lake env python3 -B - <<'NATIVE'
          from concurrent.futures import ThreadPoolExecutor
          import gzip
          from hashlib import sha256
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          from tempfile import TemporaryDirectory
          sys.path.insert(0, "ci")
          from parts import BUILD, STATE, dependencies, graph, inventory, plan, restore

          targets = {"Development.AutomorphicArithmetic.CharacterBoxes.MainConclusion"}
          project = graph()
          edges = project[1]
          wanted = dependencies(targets, edges)
          STATE.mkdir(parents=True, exist_ok=True)
          restore(plan(project), inventory(os.environ["GITHUB_REPOSITORY"]), targets, edges,
                  allow_missing=True)

          cache_url = "https://rh-cache.taucetiproject.org"
          bootstrap = "e50d09817ad81469f737e8f637561e6ccf86c670"
          manifest_sha = "292caa386a620d935cfc736b56fcceaab9fe7073086693b62e899c1ee4725f04"

          def download(url):
              return subprocess.check_output(["curl", "--fail", "--silent", "--show-error",
                  "--location", "--retry", "4", "--max-time", "60", url])

          manifest = download(f"{cache_url}/bootstrap/{bootstrap}/modules.jsonl.gz")
          if sha256(manifest).hexdigest() != manifest_sha:
              sys.exit("Community cache manifest digest mismatch")
          metadata, *rows = gzip.decompress(manifest).splitlines()
          metadata = json.loads(metadata)
          assert metadata["source_tree"] == "24df20b62d9976ccd20da819bc20b16f808f0fdd"
          assert metadata["toolchain"] == "leanprover/lean4:v4.33.1"
          index = {row[0]: row[1:] for row in map(json.loads, rows)}
          assert len(index) == metadata["modules"] == 175187

          def stem(module):
              return Path(*module.split("."))

          def artifact(module):
              return BUILD / "lib/lean" / stem(module).with_suffix(".olean")

          missing = sorted(module for module in wanted if not artifact(module).is_file())
          reported_missing = "Development.AbelianVarietyTheory.Definitions.GaloisGeometry.InvMemLatMonoidOfMemAwaySupp"
          if not artifact(reported_missing).is_file() and reported_missing not in missing:
              missing.append(reported_missing)
          print(f"Filling {len(missing)} missing modules from the pinned community cache", flush=True)
          with TemporaryDirectory(dir=STATE) as stage:
              def fetch(module):
                  dependency_hash, archive_name, digest = index[module]
                  data = download(f"{cache_url}/artifacts/leanprover-community/riemann-hypothesis/{archive_name[:-5]}.art")
                  if sha256(data).hexdigest() != digest:
                      raise ValueError(f"Community cache digest mismatch: {module}")
                  compressed = Path(stage) / archive_name
                  compressed.write_bytes(data)
                  library = artifact(module).parent.resolve()
                  ir = (BUILD / "ir" / stem(module)).parent.resolve()
                  library.mkdir(parents=True, exist_ok=True)
                  ir.mkdir(parents=True, exist_ok=True)
                  return {"file": str(compressed.resolve()), "hash": dependency_hash,
                          "base": [str(library), str(ir)]}

              with ThreadPoolExecutor(max_workers=4) as pool:
                  jobs = list(pool.map(fetch, missing))
              if jobs:
                  subprocess.run(["leantar", "--jobs", "4", "-f", "-x", "-j", "-"],
                                 input=json.dumps(jobs), text=True, check=True)
          for module in missing:
              if not artifact(module).is_file():
                  sys.exit(f"No installed .olean after unpack for {module}")
          NATIVE
      - name: Elaborate the pure zeta extraction and print its axioms
        run: |
          set -euo pipefail
          lean --version
          lake env lean -j1 \
            -o "$RUNNER_TEMP/AlpogePureZetaWindowExtraction.olean" \
            verification/AlpogePureZetaWindowExtraction.lean | tee "$RUNNER_TEMP/pure-zeta-window-lean.log"
          python3 - "$RUNNER_TEMP/pure-zeta-window-lean.log" <<'AXIOMS'
          from pathlib import Path
          import re
          import sys
          text = Path(sys.argv[1]).read_text()
          match = re.search(r"'PureZetaWindowExtraction\.pure_zeta_windows' depends on axioms: \[([^]]*)\]", text)
          if match is None or set(map(str.strip, match.group(1).split(","))) != {"propext", "Classical.choice", "Quot.sound"}:
              raise SystemExit("Missing or unexpected pure zeta axiom report")
          AXIOMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pure-zeta-window-lean-log
          path: ${{ runner.temp }}/pure-zeta-window-lean.log
          if-no-files-found: ignore
