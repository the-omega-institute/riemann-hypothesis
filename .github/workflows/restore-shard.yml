name: Check a released module
on:
  workflow_dispatch:
    inputs:
      module:
        description: Lean module to restore from published shards
        type: string
        required: true
        default: BuildAid.D1
permissions: {contents: read, actions: read}
jobs:
  restore:
    runs-on: ${{ vars.RH_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/toolchain
      - name: Measure available space for the final Main restore
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          df -hT "$PWD" /mnt
          free -h
          swapon --show
          command -v mkfs.btrfs || true
          du -sh /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache 2>/dev/null || true
          python3 ci/measure_capacity.py
