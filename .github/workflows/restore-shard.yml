name: Inspect reusable workflow input types
on:
  workflow_dispatch:
    inputs:
      number: {type: number, required: true}
permissions: {contents: write, actions: read}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env: {PROBE: '${{ toJSON(inputs) }}'}
        run: |
          echo "$PROBE"
          echo 'matrix=[{"number":1,"group":0}]' >> "$GITHUB_OUTPUT"
  dispatch:
    needs: plan
    strategy:
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/one-shard.yml
    with:
      source: b170c6cadb944f69faab5b14d418a2a4606eb1d5
      number: ${{ inputs.number }}
      group: ${{ matrix.item.group }}
      key: d93c757cdf2f1a69df1dc48e4398c294fde3df91829f5a2bb5ca79174f55de09
  matrix_number:
    needs: plan
    strategy:
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/one-shard.yml
    with:
      source: b170c6cadb944f69faab5b14d418a2a4606eb1d5
      number: ${{ matrix.item.number }}
      group: ${{ matrix.item.group }}
      key: c9e8085ce52ee5df9458963b12b81c9bd14deecdbe4d676c4a29b9179dd66b0a
