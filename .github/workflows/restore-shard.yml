name: Check a released module
on:
  workflow_dispatch:
    inputs:
      module:
        description: Lean module to restore from published shards
        type: string
        required: true
        default: BuildAid.D1
permissions: {contents: read, actions: read}
jobs:
  restore:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/toolchain
      - name: Restore from public Releases and replay the module with the Lean kernel
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.module }}
          LEAN_NUM_THREADS: '3'
        run: ./verify "$TARGET"
